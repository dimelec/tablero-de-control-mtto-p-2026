<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tablero de Control — Bitácora Preventiva</title>
<style>
  :root{
    --bg:#0d0f14; --card:#191c24; --card2:#212531; --line:#2d3340;
    --text:#f0f1f5; --sub:#9aa0ad; --accent:#f97316; --good:#22c55e;
    --warn:#f59e0b; --bad:#ef4444; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:40px;}
  .container{max-width:600px; margin:0 auto; padding:16px;}
  
  h1{font-size:20px; margin:0 0 4px;}
  .subtitle{font-size:13px; color:var(--sub); margin-bottom:16px;}
  
  .card{background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  .card-title{font-size:14px; font-weight:700; margin-bottom:12px; color:var(--text);}
  
  /* Banner de estado */
  .status-banner{padding:14px; border-radius:10px; font-weight:700; font-size:15px; text-align:center; margin-bottom:14px;}
  .status-ok{background:#123322; color:var(--good);}
  .status-warning{background:#3a2410; color:var(--warn);}
  .status-alert{background:#3a1010; color:var(--bad);}
  
  /* Tabla */
  .data-table{width:100%; border-collapse:collapse; font-size:13px;}
  .data-table th{text-align:left; color:var(--sub); font-weight:600; padding:8px 6px; border-bottom:2px solid var(--line); text-transform:uppercase; font-size:11px; letter-spacing:.05em;}
  .data-table td{padding:10px 6px; border-bottom:1px solid var(--line);}
  .data-table tr:last-child td{border-bottom:none;}
  
  .tag{display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;}
  .tag-active{background:#123322; color:var(--good);}
  .tag-inactive{background:#3a1010; color:var(--bad);}
  
  /* Métricas */
  .metric-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .metric{background:var(--card2); border-radius:10px; padding:14px 8px; text-align:center;}
  .metric-value{font-size:22px; font-weight:700; color:var(--accent);}
  .metric-label{font-size:10px; color:var(--sub); margin-top:4px; text-transform:uppercase;}
  
  /* Alertas */
  .alert-item{background:var(--card2); border-radius:8px; padding:10px 12px; margin-bottom:8px; border-left:4px solid var(--warn); font-size:13px;}
  .alert-item.critical{border-left-color:var(--bad);}
  .alert-item.info{border-left-color:var(--accent);}
  
  /* Botón */
  .refresh-btn{width:100%; padding:14px; border-radius:10px; background:var(--accent); color:#fff; border:none; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:16px; font-family:inherit;}
  .refresh-btn:active{opacity:.7;}
  
  .auto-refresh-box{display:flex; align-items:center; gap:10px; margin-bottom:16px; font-size:12px; color:var(--sub); flex-wrap:wrap;}
  .auto-refresh-box select{padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:12px; font-family:inherit;}
  
  .last-update{font-size:11px; color:var(--sub); width:100%;}
  
  .empty-state{text-align:center; padding:20px; color:var(--sub); font-size:13px;}
  
  .toast{position:fixed; bottom:16px; left:16px; right:16px; max-width:568px; margin:0 auto; background:var(--card2); border:1px solid var(--accent); padding:12px 14px; border-radius:10px; font-size:13px; display:none; z-index:60;}
  .toast.show{display:block;}
</style>
</head>
<body>

<div class="container">
  <h1>📊 Tablero de Control</h1>
  <div class="subtitle" id="last-update">🕐 Actualizado: —</div>
  
  <button class="refresh-btn" onclick="cargarDatos()">🔄 Actualizar ahora</button>
  
  <div class="auto-refresh-box">
    <span>Auto-recarga:</span>
    <select id="auto-refresh-select" onchange="cambiarAutoRefresh()">
      <option value="0">Desactivada</option>
      <option value="60">Cada 1 minuto</option>
      <option value="300" selected>Cada 5 minutos</option>
      <option value="600">Cada 10 minutos</option>
      <option value="1800">Cada 30 minutos</option>
    </select>
  </div>
  
  <!-- ESTADO GENERAL -->
  <div id="estado-general"></div>
  
  <!-- 1️⃣ AHORA -->
  <div class="card">
    <div class="card-title">1️⃣ AHORA — ¿Quién está enviando datos?</div>
    <div id="ahora-content"></div>
  </div>
  
  <!-- 2️⃣ AYER -->
  <div class="card">
    <div class="card-title">2️⃣ AYER — ¿Qué pasó y qué decidir?</div>
    <div id="ayer-content"></div>
  </div>
  
  <!-- 3️⃣ SEMANA -->
  <div class="card">
    <div class="card-title">3️⃣ SEMANA — ¿Cómo estuvo?</div>
    <div id="semana-content"></div>
  </div>
  
  <!-- 4️⃣ META -->
  <div class="card">
    <div class="card-title">4️⃣ META — ¿Vamos a cumplir?</div>
    <div id="meta-content"></div>
  </div>
  
  <!-- HOY — ACCIONES -->
  <div class="card">
    <div class="card-title">📌 HOY — Acciones</div>
    <div id="acciones-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== CONFIGURACIÓN ==================== */
const DASHBOARD_URL = "https://script.google.com/macros/s/AKfycbxZhkBl2PEhDBkHpPgpRLeKIhoKOIx6TV11pQFHTauYkPjV3jKxC-qr56d7oXtcKZQ/exec";

let autoRefreshInterval = null;

/* ==================== UTILIDADES ==================== */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function num(val){ const n = Number(val); return isNaN(n) ? 0 : n; }

/* ==================== AUTO-RECARGA ==================== */
function cambiarAutoRefresh(){
  const select = document.getElementById('auto-refresh-select');
  const segundos = parseInt(select.value);
  
  if(autoRefreshInterval) clearInterval(autoRefreshInterval);
  
  if(segundos > 0){
    autoRefreshInterval = setInterval(cargarDatos, segundos * 1000);
    toast('🔄 Auto-recarga: cada ' + Math.round(segundos/60) + ' min');
  }
}

/* ==================== CARGAR DATOS ==================== */
async function cargarDatos(){
  try{
    const resp = await fetch(DASHBOARD_URL);
    const texto = await resp.text();
    const data = JSON.parse(texto);
    
    if(data.ok && data.data){
      procesarDatos(data.data);
      actualizarUltimaCarga();
    } else {
      mostrarError(data.error || 'Sin datos. Ejecuta generarTodo.');
    }
  }catch(e){
    mostrarError('Error de conexión');
  }
}

function actualizarUltimaCarga(){
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString('es-CO');
  const hora = ahora.toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('last-update').textContent = `🕐 Actualizado: ${fecha} ${hora}`;
}

function mostrarError(msg){
  document.getElementById('estado-general').innerHTML = `
    <div class="status-banner status-alert">🔴 Error: ${msg}</div>`;
}

/* ==================== PROCESAR DATOS ==================== */
function procesarDatos(data){
  const mlAhora = num(data[1][1]);
  const turnosAhora = num(data[1][3]);
  const mlAyer = num(data[2][1]);
  const turnosAyer = num(data[2][3]);
  const mlSemana = num(data[3][1]);
  const turnosSemana = num(data[3][3]);
  const metaMes = num(data[7][1]);
  const mlMes = num(data[8][1]);
  const pct = parseFloat(String(data[9][1]).replace('%','')) || 0;
  
  renderEstadoGeneral(pct, mlAhora);
  renderAhora(data, turnosAhora, mlAhora);
  renderAyer(mlAyer, turnosAyer);
  renderSemana(mlSemana, turnosSemana);
  renderMeta(metaMes, mlMes, pct);
  renderAcciones(data);
}

/* ==================== ESTADO GENERAL ==================== */
function renderEstadoGeneral(pct, mlAhora){
  const el = document.getElementById('estado-general');
  
  if(pct >= 100){
    el.innerHTML = `<div class="status-banner status-ok">✅ Meta cumplida — ${pct}%</div>`;
  } else if(mlAhora === 0 && pct < 40){
    el.innerHTML = `<div class="status-banner status-alert">🔴 Atención inmediata — ${pct}% de meta y sin actividad ahora</div>`;
  } else if(pct < 40){
    el.innerHTML = `<div class="status-banner status-alert">🔴 Atención inmediata — ${pct}% de meta</div>`;
  } else if(pct < 70){
    el.innerHTML = `<div class="status-banner status-warning">🟡 En progreso — ${pct}% de meta</div>`;
  } else {
    el.innerHTML = `<div class="status-banner status-ok">✅ En camino — ${pct}% de meta</div>`;
  }
}

/* ==================== 1️⃣ AHORA ==================== */
function renderAhora(data, turnos, ml){
  const el = document.getElementById('ahora-content');
  
  if(turnos === 0){
    el.innerHTML = `<div class="empty-state">Sin actividad en este momento.</div>`;
    return;
  }
  
  // Buscar códigos de turnos pendientes
  const pendientes = [];
  for(let r = 12; r < data.length; r++){
    if(data[r][1] && String(data[r][1]).trim() !== ''){
      pendientes.push({
        codigo: String(data[r][1]).trim(),
        ml: num(data[r][2])
      });
    }
  }
  
  let tabla = '';
  pendientes.forEach(p => {
    tabla += `<tr><td>${p.codigo}</td><td>—</td><td>${p.ml}</td><td><span class="tag tag-active">Activo</span></td></tr>`;
  });
  
  el.innerHTML = `
    <table class="data-table">
      <tr><th>Placa</th><th>Barrio</th><th>Envíos</th><th>Estado</th></tr>
      ${tabla || '<tr><td colspan="4" class="empty-state">Sin detalle</td></tr>'}
    </table>
    <div style="margin-top:10px; font-size:12px; color:var(--sub);">ML en curso: ${ml}</div>`;
}

/* ==================== 2️⃣ AYER ==================== */
function renderAyer(ml, turnos){
  const el = document.getElementById('ayer-content');
  
  if(turnos === 0){
    el.innerHTML = `<div class="empty-state">Sin turnos cerrados ayer.</div>`;
    return;
  }
  
  const metaDia = 250;
  const metaTotal = metaDia * turnos;
  const delta = ml - metaTotal;
  const deltaStr = delta >= 0 ? `✅ +${delta}` : `❌ ${delta}`;
  
  el.innerHTML = `
    ML: ${ml} │ Meta: ${metaTotal} │ ${deltaStr}<br>
    <span style="font-size:12px; color:var(--sub);">Tramos SI: ${turnos} │ Jornadas: ${turnos}</span>`;
}

/* ==================== 3️⃣ SEMANA ==================== */
function renderSemana(ml, turnos){
  const el = document.getElementById('semana-content');
  
  if(turnos === 0){
    el.innerHTML = `<div class="empty-state">Sin actividad esta semana.</div>`;
    return;
  }
  
  const presupuesto = turnos * 250;
  const delta = ml - presupuesto;
  const deltaStr = delta >= 0 ? `+${delta} ML ✅` : `${delta} ML ❌`;
  
  el.innerHTML = `
    <div class="metric-grid">
      <div class="metric"><div class="metric-value">${ml}</div><div class="metric-label">ML / ${turnos} J</div></div>
      <div class="metric"><div class="metric-value">${presupuesto}</div><div class="metric-label">Presupuesto</div></div>
      <div class="metric"><div class="metric-value">${deltaStr}</div><div class="metric-label">Δ</div></div>
    </div>`;
}

/* ==================== 4️⃣ META ==================== */
function renderMeta(meta, mlMes, pct){
  const el = document.getElementById('meta-content');
  
  const estadoMeta = pct >= 100 ? '✅ Cumplida' : pct >= 70 ? '🟡 En progreso' : '🔴 En riesgo';
  
  el.innerHTML = `
    Mes: ${mlMes} de ${meta} │ ${pct}% │ ${estadoMeta}
    <div style="height:8px; background:var(--card2); border-radius:4px; overflow:hidden; margin-top:10px;">
      <div style="height:100%; width:${Math.min(pct,100)}%; background:${pct>=70?'var(--good)':pct>=40?'var(--accent)':'var(--bad)'}; border-radius:4px;"></div>
    </div>`;
}

/* ==================== HOY — ACCIONES ==================== */
function renderAcciones(data){
  const el = document.getElementById('acciones-content');
  const acciones = [];
  
  for(let r = 12; r < data.length; r++){
    if(data[r][1] && String(data[r][1]).trim() !== ''){
      acciones.push({
        codigo: String(data[r][1]).trim(),
        ml: num(data[r][2])
      });
    }
  }
  
  if(acciones.length === 0){
    el.innerHTML = `<div class="empty-state">✅ Sin acciones pendientes.</div>`;
    return;
  }
  
  let html = '';
  acciones.forEach(p => {
    html += `
      <div class="alert-item info">
        <strong>${p.codigo}</strong> — ${p.ml} ML pendiente de aprobación
      </div>`;
  });
  
  el.innerHTML = html;
}

/* ==================== INICIO ==================== */
window.addEventListener('load', ()=>{
  cargarDatos();
  cambiarAutoRefresh();
});
</script>
</body>
</html>
